<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Motion easings" subtitle="Live eased tracks" viewport="700x340" -->
<html><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
  .track{position:relative;height:38px;background:linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/38px 100%,rgba(255,255,255,.02);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .sq{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;background:var(--red-1);border-radius:3px;animation-iteration-count:infinite;animation-direction:alternate}
  @keyframes go{from{left:4px}to{left:calc(100% - 26px)}}
  .l1 .sq{animation:go 2s linear}
  .l2 .sq{animation:go 2s cubic-bezier(0.22,1,0.36,1);background:var(--yellow-1)}
  .l3 .sq{animation:go 2s cubic-bezier(0.83,0,0.17,1);background:var(--cyan-1)}
  .l4 .sq{animation:go 2s cubic-bezier(0.16,1,0.3,1);background:var(--green-1)}
  .rowlabel{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--fg-2);margin-bottom:4px}
  code{color:var(--fg-1);background:var(--bg-3);padding:1px 6px;border-radius:3px;font-size:11px}
</style></head><body>
<div class="lbl">easings · the brand's signature curves</div>
<div class="rowlabel"><span>linear</span><code>linear</code></div>
<div class="track l1"><div class="sq"></div></div>
<div class="rowlabel"><span>out quint</span><code>outQuint</code></div>
<div class="track l2"><div class="sq"></div></div>
<div class="rowlabel"><span>in-out quint (signature)</span><code>inOutQuint</code></div>
<div class="track l3"><div class="sq"></div></div>
<div class="rowlabel"><span>out expo</span><code>outExpo</code></div>
<div class="track l4"><div class="sq"></div></div>
</body></html>
