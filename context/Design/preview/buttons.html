<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary · ghost · active · playback" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin:6px 0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .btn{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;height:36px;padding:0 14px;border:0;border-radius:.4rem;cursor:pointer}
  .btn.primary{background:var(--white-1);color:var(--bg-1)}
  .btn.primary:hover{background:var(--white-2)}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--fg-1)}
  .btn.ghost:hover{background:rgba(255,255,255,.1)}
  .btn.active{background:var(--red-1);color:var(--bg-1)}
  .btn.ctl{background:#2A2A2A;color:#fff;border-radius:1ch;height:36px;min-width:80px;font-size:12px}
  .btn.ctl:hover{background:#3A3A3A}
  .btn.ctl:focus{background:#fff;color:#2A2A2A;outline:none}
</style></head><body>
<div class="lbl">primary / ghost / active (red-fill selected)</div>
<div class="row">
  <button class="btn primary">DEFAULT</button>
  <button class="btn ghost">GHOST</button>
  <button class="btn active">ACTIVE</button>
  <button class="btn primary" disabled style="opacity:.4">DISABLED</button>
</div>
<div class="lbl">playback controls — from the clock example</div>
<div class="row">
  <button class="btn ctl">PLAY</button>
  <button class="btn ctl">PAUSE</button>
  <button class="btn ctl">REVERSE</button>
  <button class="btn ctl">ALTERNATE</button>
  <button class="btn ctl">RESET</button>
</div>
</body></html>
