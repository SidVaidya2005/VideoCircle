<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Stroked · red dot native" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:var(--bg-2);border:1px solid rgba(255,255,255,.08);border-radius:.6rem}
  .cell svg{width:22px;height:22px;stroke:var(--fg-1);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .cell span{font-size:10px;color:var(--fg-3)}
  .note{margin-top:10px;font-size:11px;color:var(--fg-3)}
  .red{background:var(--red-1)}
</style></head><body>
<div class="lbl">iconography — stroked only, 2px, Lucide as substitute</div>
<div class="grid">
  <div class="cell"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"/></svg><span>play</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/></svg><span>pause</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>reset</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><path d="M18 8 22 12 18 16"/><path d="M22 12H6"/><path d="M6 4v16"/></svg><span>seek</span></div>
  <div class="cell"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>complete</span></div>
  <div class="cell" style="background:var(--red-1)"><div style="width:10px;height:10px;background:var(--bg-1)"></div><span style="color:var(--bg-1)">dot</span></div>
</div>
<div class="note">Brand has no built-in icon font. Use Lucide (2px stroke) for interface controls. Red square dot = the only <em>native</em> brand glyph.</div>
</body></html>
