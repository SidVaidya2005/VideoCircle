<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Wordmark" subtitle="Red square dots the i" viewport="700x400" -->
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono);display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;height:calc(100vh - 40px)}
  .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px;text-align:center}

  /* THE RECIPE — copy this. The wordmark is live text, never an image file. */
  .wordmark{
    font-family:var(--font-mono);
    font-weight:700;
    /* clamps so the wordmark never outruns a 360px viewport */
    font-size:clamp(var(--text-xl), 11vw, var(--text-4xl));
    line-height:var(--leading-tight);
    letter-spacing:var(--tracking-normal);
    color:var(--fg-1);
    display:inline-flex;
    align-items:flex-start;
  }
  /* U+0131 dotless i on BOTH i's, so each red square is the only tittle */
  .wordmark .i{position:relative}
  .wordmark .i::before{
    content:'';
    position:absolute;
    /* 0.25em, not 50%: JetBrains Mono centres the i stem at 0.245em while the
       0.6em advance box centres at 0.3em, so a box-centred square hangs right
       of the letter. Measured; see src/app/globals.css. */
    left:.25em;
    transform:translateX(-50%);
    top:.235em;  /* measured; see src/app/globals.css */
    width:.17em;
    height:.17em;
    background:var(--red-1);   /* the one signal colour on the mark */
  }

  .row{display:flex;flex-wrap:wrap;align-items:center;gap:20px 34px;justify-content:center}
  .mark{width:64px;height:64px;border-radius:12px;background:var(--bg-1);box-shadow:var(--shadow-ring);display:flex;align-items:center;justify-content:center}
  .mark i{display:block;width:24px;height:24px;background:var(--red-1)}
  .sizes{display:flex;align-items:baseline;gap:26px;color:var(--fg-1)}
</style></head><body>

<div>
  <div class="lbl">wordmark — live text, one family, PascalCase, both i&#39;s dotted</div>
  <div class="wordmark">V<span class="i">&#x0131;</span>deoC<span class="i">&#x0131;</span>rcle</div>
</div>

<div>
  <div class="lbl">compact mark — favicon · og · avatar fallback</div>
  <div class="row">
    <div class="mark"><i></i></div>
    <div class="sizes">
      <span class="wordmark" style="font-size:var(--text-lg)">V<span class="i">&#x0131;</span>deoC<span class="i">&#x0131;</span>rcle</span>
      <span class="wordmark" style="font-size:var(--text-base)">V<span class="i">&#x0131;</span>deoC<span class="i">&#x0131;</span>rcle</span>
    </div>
  </div>
</div>

</body></html>
