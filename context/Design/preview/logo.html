<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo" subtitle="V4 animated wordmark" viewport="700x400" -->
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:14px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;height:calc(100vh - 28px)}
  .frame{position:relative;width:100%;max-width:640px;aspect-ratio:16/9;background:var(--bg-1);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
  .frame img{width:90%;height:auto}
  .over{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.16em;color:var(--fg-1)}
</style></head><body>
<div class="frame">
  <img src="../assets/images/animejs-v4-logo-animation-dark.gif" alt="Anime.js V4 logo">
</div>
</body></html>
