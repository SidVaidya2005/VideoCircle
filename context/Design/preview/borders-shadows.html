<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Borders & shadows" subtitle="Subtle · dashed · glow" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .box{height:64px;border-radius:.6rem;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fg-2);background:var(--bg-2)}
  .b1{border:1px solid rgba(255,255,255,.08)}
  .b2{border:1px solid rgba(255,255,255,.15)}
  .b3{border:1px dashed rgba(255,255,255,.5)}
  .b4{border:1px dotted rgba(255,255,255,.5)}
  .b5{border:1px solid var(--red-1)}
  .s1{box-shadow:0 0 0 1px rgba(255,255,255,.1)}
  .s2{box-shadow:0 0 24px rgba(255,75,75,.45)}
  .s3{box-shadow:0 10px 10px 0 var(--black-1)}
</style></head><body>
<div class="lbl">borders</div>
<div class="row" style="margin-bottom:14px">
  <div class="box b1">subtle .08</div>
  <div class="box b2">soft .15</div>
  <div class="box b3">dashed .5</div>
  <div class="box b4">dotted .5</div>
</div>
<div class="lbl">shadows & signal rings</div>
<div class="row">
  <div class="box b5">red 1px ring</div>
  <div class="box s1">inset ring</div>
  <div class="box s2">red glow</div>
  <div class="box s3">mask shadow</div>
</div>
</body></html>
