<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Terminal scale 12→80px" viewport="700x360" -->
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:18px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono)}
  .row{display:grid;grid-template-columns:72px 1fr;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border-bottom:none}
  .tok{color:var(--fg-3);font-size:11px;letter-spacing:.06em}
  .spec{color:var(--fg-1)}
</style></head><body>
<div class="row"><span class="tok">5xl · 80</span><span class="spec" style="font-size:64px;font-weight:700;line-height:1">Aa</span></div>
<div class="row"><span class="tok">3xl · 40</span><span class="spec" style="font-size:40px;font-weight:700;line-height:1.1">videocircle</span></div>
<div class="row"><span class="tok">2xl · 32</span><span class="spec" style="font-size:32px;font-weight:700;line-height:1.1">kzt-9f4-qmx</span></div>
<div class="row"><span class="tok">xl · 24</span><span class="spec" style="font-size:24px;font-weight:700">4 participants</span></div>
<div class="row"><span class="tok">base · 16</span><span class="spec">The quick brown fox jumps over 12,345.678</span></div>
<div class="row"><span class="tok">xs · 12</span><span class="spec" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">START A MEETING</span></div>
</body></html>
