<!DOCTYPE html>
<!-- @dsCard group="Type" name="Typeface" subtitle="JetBrains Mono — the only family" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Typeface</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono);display:flex;flex-direction:column;gap:10px;justify-content:center;height:calc(100vh - 40px)}
  .big{font-size:72px;font-weight:700;line-height:1;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:0}
  .dot{display:inline-block;width:14px;height:14px;background:var(--red-1);margin-left:-2px;margin-right:4px;align-self:flex-end;margin-bottom:10px}
  .meta{display:flex;gap:24px;color:var(--fg-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .meta strong{color:var(--fg-1)}
</style></head><body>
<div class="big">videoc<span class="dot"></span>rcle</div>
<div style="font-size:13px;color:var(--fg-2)">JetBrains Mono — Regular / Bold, via next/font/google · fallback: IoskeleyMono → IBM Plex Mono → ui-monospace</div>
<div class="meta">
  <span><strong>0123456789</strong></span>
  <span><strong>{ } ( ) [ ] => ;</strong></span>
  <span><strong>● ▲ ■ / — ·</strong></span>
</div>
</body></html>
