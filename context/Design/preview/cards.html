<!DOCTYPE html>
<!-- @dsCard group="Components" name="Cards" subtitle="bg-2 · flat · signal variant" viewport="700x190" -->
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-1);color:var(--fg-1);font-family:var(--font-mono)}
  .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .card{background:var(--bg-2);border:1px solid rgba(255,255,255,.08);border-radius:1rem;padding:16px;display:flex;flex-direction:column;gap:8px}
  .card .over{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
  .card h3{font-size:14px;font-weight:700}
  .card p{font-size:11px;color:var(--fg-2);line-height:1.4}
  .card.signal{border-color:var(--red-1);box-shadow:inset 0 0 0 1px rgba(255,75,75,.3)}
  .dot{display:inline-block;width:8px;height:8px;background:var(--red-1);vertical-align:middle;margin-right:6px}
</style></head><body>
<div class="lbl">card · bg-2 · 1px subtle border · 1rem radius · no drop shadow</div>
<div class="grid">
  <div class="card"><span class="over">timer</span><h3><span class="dot"></span>anmate()</h3><p>Animate any CSS prop, SVG attr, or JS value.</p></div>
  <div class="card signal"><span class="over">selected</span><h3 style="color:var(--red-1)">stagger</h3><p>Sequence delays with from:'center'.</p></div>
  <div class="card"><span class="over">utility</span><h3>easings</h3><p>Linear, cubic-bezier, spring, irregular.</p></div>
</div>
</body></html>
