<!--
  VideoCircle wordmark: a red square separating "Video" from "Circle".

  The square is the brand's only native glyph, and assets/mark.svg is that same
  square on its own — so the compact mark reads as a compression of the wordmark
  rather than as a second, unrelated shape. One family, no tracking, because the
  brand reserves wide tracking for CAPS overlines.

  IN THE APP, RENDER THE WORDMARK AS LIVE TEXT, NOT THIS FILE. It is a mono
  wordmark, so real text in next/font's JetBrains Mono stays crisp at every
  size, scales with the type ramp, and is readable by screen readers. See
  preview/logo.html for the HTML/CSS recipe. This SVG exists only for places
  live text is unavailable: OG images, README embeds, external decks.

  Geometry mirrors the .wordmark-dot rule in src/app/globals.css, which is the
  source of intent: a 0.2em square with 0.14em either side, its bottom edge
  0.22em above the baseline. Nothing here is measured from a glyph. The square
  this replaced dotted both i's and had to be aligned to JetBrains Mono's own
  stem centre, which is a measurement no other face reproduces; keep it that way
  if the family ever changes.

  At font-size 48 the mono advance is 28.8, so:

      "Video" spans 0 to 144          (5 advances)
      separator spans 144 to 167.04   (0.48em total, narrower than one advance)
      "Circle" spans 167.04 to 339.84 (6 advances)

  Colours are literals because an SVG cannot read CSS custom properties. They
  match the fg-1 and red-1 tokens in colors_and_type.css; keep them in sync by
  hand. (Token names appear without their CSS prefix: an XML comment may not
  contain a double hyphen.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" role="img" aria-label="VideoCircle">
  <title>VideoCircle</title>

  <text x="0" y="60"
        font-family="'JetBrains Mono','IoskeleyMono','IBM Plex Mono',ui-monospace,monospace"
        font-size="48" font-weight="700" letter-spacing="0" fill="#dddcda"
        xml:space="preserve">Video</text>

  <rect x="150.72" y="39.84" width="9.6" height="9.6" fill="#ff4b4b" />

  <text x="167.04" y="60"
        font-family="'JetBrains Mono','IoskeleyMono','IBM Plex Mono',ui-monospace,monospace"
        font-size="48" font-weight="700" letter-spacing="0" fill="#dddcda"
        xml:space="preserve">Circle</text>
</svg>
